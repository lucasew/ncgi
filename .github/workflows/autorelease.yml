name: autorelease

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: mise run codegen
      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update generated code"
          title: "chore: update generated code"
          body: "This PR updates generated code."
          branch: "chore/codegen"
          delete-branch: true
          base: ${{ github.head_ref || github.ref_name }}
      - run: mise run ci
      - name: Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v$(date +%Y%m%d%H%M%S) --generate-notes
